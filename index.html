<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16233A">
<title>Buku Kripik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="gate" class="gate" hidden>
  <div class="gate-slip">
    <p class="gate-kop">Buku Kripik</p>
    <h1 class="gate-title">Catatan hutang &amp; titipan</h1>
    <p class="gate-sub">Masuk dengan akun yang terdaftar di Firebase.</p>
    <label class="field">
      <span>Email</span>
      <input id="gEmail" type="email" autocomplete="username" inputmode="email">
    </label>
    <label class="field">
      <span>Kata sandi</span>
      <input id="gPass" type="password" autocomplete="current-password">
    </label>
    <p id="gErr" class="gate-err" hidden></p>
    <button id="gBtn" class="btn btn-primary btn-block">Masuk</button>
  </div>
</section>

<!-- ============ APP ============ -->
<div id="shell" class="shell" hidden>

  <header class="topbar">
    <div>
      <p class="topbar-kop">Buku Kripik</p>
      <h1 id="viewTitle" class="topbar-title">Beranda</h1>
    </div>
    <button id="menuBtn" class="icon-btn" aria-label="Menu lainnya">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
    </button>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar">
    <a href="#/beranda"  data-tab="beranda"><span>Beranda</span></a>
    <a href="#/ambil"    data-tab="ambil"><span>Ambil</span></a>
    <a href="#/setor"    data-tab="setor"><span>Setor</span></a>
    <a href="#/retur"    data-tab="retur"><span>Retur</span></a>
    <a href="#/nota"     data-tab="nota"><span>Nota</span></a>
  </nav>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-scrim" data-close></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div id="toast" class="toast" hidden></div>

<div id="boot" class="boot"><span class="boot-mark"></span></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
